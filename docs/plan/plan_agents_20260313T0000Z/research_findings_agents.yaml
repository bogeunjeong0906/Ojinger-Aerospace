open_questions:
  - question: Is `runSubagent` provided as an actual runtime API or is it a logical protocol to be implemented by the orchestrator runtime?
    context: Multiple agent files (orchestrator) reference `runSubagent` but no implementation details or runtime bindings are present in agent files.
  - question: Where are shared tools like `manage_todo_list` and `evidence` storage implemented and what are their exact schemas/paths?
    context: Agents reference manage_todo_list and evidence paths but repo-level implementations were not found in analyzed agent files.
  - question: How strictly should the Copilot instruction language rule (Korean explanations, English artefacts) be enforced across automated agent outputs and orchestrator syntheses?
    context: Copilot-instructions enforces explanation language in Korean while agents demand "Output ONLY requested deliverable"; clarify operational enforcement.

gaps:
  - area: runtime delegation primitives
    description: "Agent files depend on runSubagent and orchestration runtime features, but those primitives and their API contracts are not present in the analyzed files."
    impact: "Blocks end-to-end automation until runtime bindings for delegation are available."
  - area: evidence/log schema
    description: "Agents instruct writing logs and evidence to docs/plan/{plan_id}/..., but exact file naming conventions/manifest schemas are underspecified."
    impact: "Impedes automated collection/consumption of evidence by downstream agents."
  - area: domain_knowledge enforcement artifacts
    description: "Copilot instructions require `.github/domain_knowledge` as source-of-truth; those referenced files were not part of this analysis and must be consumed for tool-specific rules (kOS/kRPC/dearpygui)."
    impact: "Research and implementer agents need those files to obey domain-specific constraints; absence reduces confidence for domain-specific code generation."
