patterns_found:
  - category: architecture
    pattern: orchestrator-delegation
    description: Central `gem-orchestrator` detects phases and always delegates to subagents via a `runSubagent` protocol; orchestrator must not perform delegated work itself.
    examples:
      - file: gem-orchestrator.agent.md
        location: gem-orchestrator.agent.md:@@workflow
        snippet: "Delegate to researcher via runSubagent (up to 4 concurrent)"
    prevalence: common

  - category: communication
    pattern: strict_output_only
    description: Agents repeatedly enforce: return only the requested deliverable in their specified output schema; no extra commentary or artifacts unless requested.
    examples:
      - file: gem-documentation-writer.agent.md
        location: gem-documentation-writer.agent.md:@@constraints
        snippet: "Output ONLY the requested deliverable. For code requests: code ONLY, zero explanation..."
    prevalence: common

  - category: tool_usage
    pattern: prefer_built-in_tools
    description: Prefer dedicated built-in tools (`read_file`, `create_file`, `grep_search`, etc.) over shell/terminal commands; batch independent operations where possible.
    examples:
      - file: gem-browser-tester.agent.md
        location: gem-browser-tester.agent.md:@@constraints
        snippet: "Use dedicated tools (read_file, create_file, etc.) over terminal commands"
    prevalence: common

  - category: verification
    pattern: depth_based_workflows
    description: Agents define verification steps and result schemas (output_format_guide) and often require writing logs on failure to docs/plan/{plan_id}/logs/.
    examples:
      - file: gem-devops.agent.md
        location: gem-devops.agent.md:@@workflow
        snippet: "Log Failure: If status=failed, write to docs/plan/{plan_id}/logs/...yaml"
    prevalence: common

related_architecture:
  components_relevant_to_domain:
