      responsibility: Central phase detection, delegation, retries, synthesis
      location: .github/agents/gem-orchestrator.agent.md
      relationship_to_domain: "Coordinates all other agents; single point of orchestration"
    - component: gem-researcher
      responsibility: Produce domain-scoped YAML research findings used by planner and implementer
      location: .github/agents/gem-researcher.agent.md
      relationship_to_domain: "Feeds planner with findings and confidence"
    - component: gem-planner
      responsibility: Create DAG plans and plan.yaml; validate against PRD
      location: .github/agents/gem-planner.agent.md
      relationship_to_domain: "Transforms research → executable tasks/contract definitions"

  interfaces_used_by_domain:
    - interface: runSubagent / delegation_protocol
      location: gem-orchestrator.agent.md:@@delegation_protocol
      usage_pattern: orchestrator -> subagent RPC-style delegation with agent-specific params

  data_flow_involving_domain: |
    User request → orchestrator phase detection → orchestrator delegates research tasks to gem-researcher → researcher writes docs/plan/{plan_id}/research_findings_*.yaml → planner consumes research findings to create docs/plan/{plan_id}/plan.yaml → orchestrator delegates execution tasks to implementer/devops/browser-tester → reviewers/doc-writer produce audit/docs → orchestrator synthesizes and finalizes PRD/docs.

  key_relationships_to_domain:
    - from: gem-orchestrator
      to: gem-researcher
      relationship: delegates via runSubagent
    - from: gem-planner
      to: gem-implementer
      relationship: provides plan.yaml (tasks) to implement

