tldr: |
  - The repository defines a structured multi-agent system with a central `gem-orchestrator` and seven specialized agents (researcher, planner, implementer, reviewer, documentation-writer, devops, browser-tester).
  - Agents share repeated conventions: strict input/output JSON/YAML guides, "Output ONLY the requested deliverable", tool-usage constraints, and delegation/approval gates centered on the orchestrator.
  - Key technologies referenced: Playwright/Chrome DevTools (browser tests), Docker/Kubernetes (devops), casadi & dearpygui (project standards), kOS/kRPC domain-knowledge; security review and PRD validation are baked into workflows.
  - Open questions/gaps: where `runSubagent`/manage_todo_list implementations live, evidence/log schema and storage conventions, and operational enforcement of Copilot language/diagram rules.

