pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: optimizer와 exporter는 준비되었지만 controler_1axis.ks가 비어 있어 실제 비행 제어 루프가 연결되지 않음
      likelihood: medium
      impact: high
      mitigation: T7에서 manual arm + READJSON polling 기반의 최소 실행 루프를 먼저 고정한다
    - scenario: mock telemetry와 live kRPC payload shape가 달라 supervisor abort/complete 판단이 왜곡됨
      likelihood: medium
      impact: high
      mitigation: 실제 KSP 세션에서 snapshot 샘플을 수집해 alias/default 규칙을 보정한다
    - scenario: host filesystem과 kOS volume 경로 가정이 다르면 flight_plan 배포가 막힘
      likelihood: medium
      impact: high
      mitigation: volume mount/복사 절차를 runbook과 manager dispatch API에 명시한다
    - scenario: dearpygui/krpc optional dependency가 계속 미설치 상태라 live 운영 검증이 뒤로 밀림
      likelihood: high
      impact: medium
      mitigation: headless 검증 경로를 유지하되 T9/T11 전에 설치 문서와 smoke checklist를 추가한다
  assumptions:
    - 관제탑은 Python 3.10 + CasADi 환경에서 동작하며, 현재 로컬 테스트 범위는 green 상태다
    - contract version 1.0.0은 T7/T8 착수 전까지 기준선으로 유지한다
    - krpc와 dearpygui는 optional dependency로 계속 soft-gated 한다
    - onboard kOS는 WRITEJSON exporter를 수용하지만 controller 쪽 READJSON/runtime 동작은 아직 비행 검증 전이다

implementation_specification:
  code_structure: system/control_tower는 main.py entrypoint, backend/runtime.py + backend/services.py 조립층, backend/contracts/ 계약 패키지, backend/optimizer.py, backend/telemetry.py, backend/supervisor.py, manager/application.py, ui/app.py로 분리되었다. system/vessle는 export_prams.ks가 구현되었고 controler_1axis.ks는 아직 placeholder다.
  affected_areas:
    - system/control_tower/main.py
    - system/control_tower/backend/contracts/
    - system/control_tower/backend/contracts/fixtures/
    - system/control_tower/backend/
    - system/control_tower/manager/
    - system/control_tower/ui/
    - system/vessle/export_prams.ks
    - system/vessle/controler_1axis.ks
    - tests/
    - docs/plan/ksp-1axis-20260310-01/
  component_details:
    - component: tower entrypoint
      responsibility: 설정 로드, 서비스 조립, headless/ui/auto boot path 선택과 JSON report 출력
      interfaces:
        - run(argv?) -> exit_code
        - RuntimeConfig.load(config_path?, mode?, connect_live_services?) -> RuntimeConfig
    - component: telemetry adapter
      responsibility: mock/live snapshot 수집, alias/default 정규화, contract-valid TelemetrySnapshot 생성
      interfaces:
        - connect(endpoint) -> session
        - stream_snapshot(plan_id?, vessel_name?, status?) -> TelemetrySnapshot
    - component: optimizer service
      responsibility: parameter_export 기반 OptimizationRequest 구성, 1축 상승 문제를 CasADi로 풀고 진단 가능한 flight plan 생성
      interfaces:
        - build_optimization_request_from_parameter_export(parameter_export, defaults?, overrides?) -> OptimizationRequest
        - solve(request: OptimizationRequest) -> FlightPlan
    - component: mission manager
      responsibility: 현재는 headless boot/report 제공까지만 구현되었고, export/optimize/dispatch 통합 운영 시나리오는 T8 범위다
      interfaces:
        - ControlTowerApplication.boot() -> ApplicationReport
    - component: onboard parameter exporter
      responsibility: 로켓 상태/스펙을 JSON으로 기록
      interfaces:
        - export_prams.ks -> parameter_export.json
    - component: onboard controller
      responsibility: flight_plan.json 로드, PID 제어, throttle/steering lock 적용이 목표이나 아직 미구현
      interfaces:
        - controler_1axis.ks(plan_path) -> pending
  dependencies:
    - component: mission manager
      relationship: depends on telemetry adapter and optimizer service
    - component: ui layer
      relationship: depends on mission manager public actions
    - component: onboard controller
      relationship: depends on flight_plan.json contract from optimizer service
    - component: reviewer/doc agent outputs
      relationship: depend on stable contracts and scaffolded code paths
  integration_points:
    - kRPC connection bootstrap from tower to KSP instance
    - JSON file exchange between tower artifacts and kOS volume/files
    - manual or supervisory arming flow for onboard controller
    - offline/headless validation harness for contracts, optimizer, telemetry, supervisor

contracts:
  - from_task: T2
    to_task: T4
    interface: parameter export contract
    format: JSON object with vehicle mass, fuel, thrust, engine, environment, timestamp
  - from_task: T3
    to_task: T5
    interface: optimization request contract
    format: JSON object with initial state, bounds, objective weights, mission constraints
  - from_task: T5
    to_task: T8
    interface: flight plan contract
    format: JSON object with target profile, time grid, throttle profile, control gains, abort conditions
  - from_task: T6
    to_task: T8
    interface: telemetry snapshot contract
    format: JSON object with universal time, altitude, vertical_speed, mass, thrust, throttle_cmd, status
  - from_task: T8
    to_task: T10
    interface: supervisor state transitions
    format: enum-like status flow draft -> params_exported -> optimized -> armed -> active -> completed|aborted

