plan_id: export-consumedresources-fix-20260324
objective: Fix the real runtime failure in src/Script/export.ks caused by iterating engine consumed resources through a kOS collection path that collides with case-insensitive string-key semantics, while preserving export behavior and runtime safety.
tasks:
  - id: research-consumedresources-lexicon-semantics
    owner: researcher
    goal: Verify, from KOS_DOC, the exact behavior of Engine:CONSUMEDRESOURCES as a Lexicon of ConsumedResource, confirm how case-insensitive string keys and KEYS enumeration can trigger the duplicate key '(CooledLCH4)' failure at runtime, and identify the safest documented iteration/access pattern for export.ks.
    deps: []
    status: pending
    inputs:
      - src/Script/export.ks
      - docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      - docs/domain_knowledge/KOS_DOC/structures/vessels/consumedresource.html
      - docs/domain_knowledge/KOS_DOC/structures/collections/lexicon.html
      - docs/domain_knowledge/KOS_DOC/language/syntax.html
    outputs:
      - Verified root-cause statement for the duplicate-key runtime failure.
      - Documented safe access pattern for consumed resources that avoids unsafe KEYS-dependent behavior.
      - Short list of directly relevant nearby or global same-class collection risks in export.ks, if any.
    acceptance:
      - Research explicitly ties the failure to documented kOS collection behavior rather than guesswork.
      - Research states whether the unsafe step is KEYS materialization, string-key lookup semantics, or another documented Lexicon behavior in the consumed-resources path.
      - Research provides one implementation-ready iteration or extraction pattern that is valid kOS syntax and appropriate for runtime safety.
      - Any additional same-class risks included are directly relevant to this failure mode.
    constraints:
      - Use KOS_DOC as the authority for kOS syntax and collection semantics.
      - Keep scope limited to the consumed-resources runtime failure and directly relevant same-class issues.
      - Prefer the smallest change that removes the runtime hazard.
  - id: implement-consumedresources-runtime-fix
    owner: implementer
    goal: Update src/Script/export.ks to remove the documented failure path around Engine:CONSUMEDRESOURCES iteration, preserve the current exported structure as much as possible, and address any directly relevant same-class issue identified by research.
    deps:
      - research-consumedresources-lexicon-semantics
    status: pending
    inputs:
      - src/Script/export.ks
      - Research output from research-consumedresources-lexicon-semantics
      - docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      - docs/domain_knowledge/KOS_DOC/structures/vessels/consumedresource.html
      - docs/domain_knowledge/KOS_DOC/structures/collections/lexicon.html
    outputs:
      - Updated src/Script/export.ks without the duplicate-key runtime failure in the consumed-resources export path.
    acceptance:
      - export.ks no longer fails at runtime with duplicate key '(CooledLCH4)' when processing engine consumed resources.
      - The fix uses documented kOS syntax and collection behavior validated by research.
      - Engine propellant data remains exported in a stable structure unless research shows a structure adjustment is required for safety.
      - No unrelated refactor is introduced.
      - Any additional fix outside the immediate loop is limited to directly relevant same-class collection hazards confirmed by research.
    constraints:
      - Keep implementation changes minimal and dependency-driven.
      - Prioritize runtime safety and correct kOS behavior over preserving a fragile iteration pattern.
      - Do not add documentation work unless the implementation materially changes the exported contract.
