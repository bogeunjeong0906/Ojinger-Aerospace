task_id: research-kos-export-gaps
status: completed
summary: >-
  KOS_DOC 기준으로 export.ks의 현재 엔진/탱크/델타V 수집에는 문서상 맞지 않거나
  과도하게 추정한 부분이 있다. 안전하게 추가 가능한 값은 vessel/body/part/engine/resource/
  stock DeltaV suffix로 검증되며, 길이, 직경, 기준 면적, 항력 계수, payload_mass 같은 값은
  base kOS 문서만으로는 정확 추출이 어렵다.
verified_safe_additions:
  rocket_level:
    - field: wet_mass
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/vessel.html
      rationale: Vessel:WETMASS가 문서화되어 있으며 전체 로켓의 fully-fueled mass를 직접 제공한다.
    - field: dry_mass
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/vessel.html
      rationale: Vessel:DRYMASS가 문서화되어 있으며 전체 로켓의 no-resources mass를 직접 제공한다.
    - field: vessel_type
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/vessel.html
      rationale: Vessel:TYPE은 직접 제공되는 식별 보조 정보라 export schema 확장 시 안전하다.
  body_level:
    - field: has_ocean
      source_doc: docs/domain_knowledge/KOS_DOC/structures/celestial_bodies/body.html
      rationale: Body:HASOCEAN은 직접 제공되는 Boolean이다.
    - field: has_solid_surface
      source_doc: docs/domain_knowledge/KOS_DOC/structures/celestial_bodies/body.html
      rationale: Body:HASSOLIDSURFACE는 직접 제공되는 Boolean이다.
    - field: rotation_period
      source_doc: docs/domain_knowledge/KOS_DOC/structures/celestial_bodies/body.html
      rationale: Body:ROTATIONPERIOD가 초 단위로 문서화되어 있다.
    - field: soi_radius
      source_doc: docs/domain_knowledge/KOS_DOC/structures/celestial_bodies/body.html
      rationale: Body:SOIRADIUS가 직접 제공된다.
    - field: atmosphere_exists
      source_doc: docs/domain_knowledge/KOS_DOC/structures/celestial_bodies/atmosphere.html
      rationale: Atmosphere:EXISTS로 대기 존재 여부를 안전하게 분기할 수 있다.
    - field: launch_latitude
      source_doc: docs/domain_knowledge/KOS_DOC/structures/orbits/orbitable.html
      rationale: SHIP은 Orbitable이므로 Orbitable:LATITUDE를 직접 사용할 수 있다.
    - field: launch_longitude
      source_doc: docs/domain_knowledge/KOS_DOC/structures/orbits/orbitable.html
      rationale: SHIP은 Orbitable이므로 Orbitable:LONGITUDE를 직접 사용할 수 있다.
    - field: launch_altitude
      source_doc: docs/domain_knowledge/KOS_DOC/structures/orbits/orbitable.html
      rationale: SHIP은 Orbitable이므로 Orbitable:ALTITUDE를 직접 사용할 수 있다.
    - field: launch_terrain_height
      source_doc: docs/domain_knowledge/KOS_DOC/math/geocoordinates.html
      rationale: SHIP:GEOPOSITION:TERRAINHEIGHT로 sea-level 대비 지형 높이를 직접 얻을 수 있다.
  stage_level:
    - field: stage_wet_mass
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/part.html
      rationale: Part:WETMASS와 Part:STAGE를 이용해 같은 stage의 파트 wet mass를 합산할 수 있다.
    - field: stage_dry_mass
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/part.html
      rationale: Part:DRYMASS와 Part:STAGE를 이용해 같은 stage의 파트 dry mass를 합산할 수 있다.
    - field: engine_count
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      rationale: SHIP:ENGINES 목록을 Engine:STAGE로 필터링하면 stage별 engine 수를 안전하게 셀 수 있다.
    - field: stage_max_thrust
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      rationale: Engine:MAXTHRUST를 stage별로 합산하면 된다.
    - field: fuel_mass
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
      rationale: Resource:AMOUNT * Resource:DENSITY로 LiquidFuel mass를 계산할 수 있다.
    - field: oxidizer_mass
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
      rationale: Resource:AMOUNT * Resource:DENSITY로 Oxidizer mass를 계산할 수 있다.
    - field: tank_capacity
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
      rationale: Resource:CAPACITY를 stage 내 리소스별로 합산할 수 있다.
    - field: twr_surface_initial
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      rationale: >-
        Stage thrust와 stage wet mass, 그리고 Body:MU / (Body:RADIUS + SHIP:ALTITUDE)^2 로
        계산 가능한 파생값이다. thrust는 kN, mass는 Mg이므로 TWR = thrust / (mass * g)
        형태로 계산 가능하다.
  engine_level:
    - field: engine_name
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/part.html
      rationale: Engine은 Part를 상속하므로 Engine:NAME 또는 Engine:TITLE 사용이 안전하다.
    - field: engine_mass
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/part.html
      rationale: Engine은 Part를 상속하므로 Engine:DRYMASS 또는 Engine:MASS를 직접 사용할 수 있다.
    - field: engine_thrust
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      rationale: Engine:MAXTHRUST가 직접 문서화되어 있다.
    - field: engine_isp_vac
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      rationale: Engine:VACUUMISP가 직접 문서화되어 있다.
    - field: engine_isp_sea
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      rationale: Engine:SEALEVELISP가 직접 문서화되어 있다.
    - field: max_mass_flow
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      rationale: Engine:MAXMASSFLOW가 직접 문서화되어 있다.
    - field: max_fuel_flow
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      rationale: Engine:MAXFUELFLOW가 직접 문서화되어 있다.
    - field: propellant_mix
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
      rationale: Engine:CONSUMEDRESOURCES는 resource name과 ratio를 제공한다.
  tank_level:
    - field: tank_part_mass_current
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/part.html
      rationale: Part:MASS는 현재 리소스를 포함한 파트 질량이다.
    - field: tank_part_mass_dry
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/part.html
      rationale: Part:DRYMASS는 empty-resources 기준 질량이다.
    - field: tank_part_mass_wet
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/part.html
      rationale: Part:WETMASS는 full-resources 기준 질량이다.
    - field: resource_name
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
      rationale: Resource:NAME이 직접 제공된다.
    - field: resource_amount
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
      rationale: Resource:AMOUNT가 직접 제공된다.
    - field: resource_capacity
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
      rationale: Resource:CAPACITY가 직접 제공된다.
    - field: resource_density
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
      rationale: Resource:DENSITY가 직접 제공된다.
    - field: resource_mass
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
      rationale: amount * density로 계산 가능한 안전한 파생값이다.
    - field: resource_capacity_mass
      source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
      rationale: capacity * density로 계산 가능한 안전한 파생값이다.
risky_or_incorrect_current_usage:
  - field_or_api: Part:MAXTHRUST / Part:ISP
    reason: >-
      현재 export.ks는 p:MAXTHRUST 와 p:ISP를 Part에서 읽고 있다.
      문서상 MAXTHRUST와 ISP는 Engine 구조체의 suffix이며 Part 문서에는 없다.
      엔진 정보는 SHIP:ENGINES 또는 Engine 구조체로 읽어야 한다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/engine.html
  - field_or_api: Resource:MAX
    reason: >-
      현재 export.ks는 res:MAX를 사용한다. 문서상 Resource의 최대 용량 suffix는 CAPACITY이며 MAX는 없다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
  - field_or_api: Part:HASMODULE("ModuleFuelTanks")
    reason: >-
      ModuleFuelTanks 문자열은 stock kOS 문서의 일반 연료탱크 판별 근거가 아니다.
      base KSP 탱크는 Part:RESOURCES로 판별하는 편이 안전하다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/part.html
  - field_or_api: stage deltav manual formula
    reason: >-
      현재 export.ks는 LiquidFuel만 사용해 deltaV를 손계산한다.
      Oxidizer 및 기타 propellant를 무시하고, 엔진 ISP도 Part에서 잘못 읽고 있어 결과가 쉽게 틀어진다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/resource.html
  - field_or_api: body_info["atm"] = ship_body:ATM
    reason: >-
      WRITEJSON은 serializable object만 허용한다.
      serialization 문서는 serializable type이 명시적으로 표시되어야 한다고 설명하며,
      Atmosphere 문서에는 serializable note가 확인되지 않는다.
      원시 suffix 값으로 평탄화해서 저장하는 편이 안전하다.
    source_doc: docs/domain_knowledge/KOS_DOC/commands/serialization.html
  - field_or_api: terminal open event string "Open Terminal"
    reason: >-
      Part:GETMODULE과 PartModule:DOEVENT 자체는 문서화되어 있지만,
      "Open Terminal" 이벤트 이름 문자열은 일반 PartModule 문서가 아니라 저장된 메모에 가깝다.
      export 연구 범위에서 필수는 아니며 구현 안정성을 위해 비핵심 처리로 두는 편이 낫다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/partmodule.html
unsupported_or_too_risky:
  - field: length
    reason: >-
      Vessel:BOUNDS:SIZE는 bounding-box 대각선 벡터와 box-relative 축 길이를 제공하지만,
      그 중 어떤 축을 rocket longitudinal axis로 고정할지 base kOS 문서만으로 확정하기 어렵다.
      정확한 로켓 길이로 export하면 의미를 과장할 위험이 있다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/bounds.html
  - field: diameter
    reason: >-
      BOUNDS로 bounding-box 크기는 얻을 수 있지만, 원통형 최대 직경을 정확히 뜻하는 diameter를
      문서만으로 직접 읽을 수는 없다. 특정 축 선택이 추정이 된다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/bounds.html
  - field: reference_area
    reason: >-
      base kOS 문서에는 직접적인 aerodynamic reference area suffix가 없다.
      FAR addon 문서에는 있으나 base export.ks에 안전 기본값으로 가정하면 안 된다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/bounds.html
  - field: drag_coefficient
    reason: >-
      base kOS 핵심 문서에는 drag coefficient suffix가 없다.
      addon 문서에 존재하는 값은 의존 모드가 명시되지 않으면 사용하면 안 된다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/vessel.html
  - field: payload_mass
    reason: >-
      payload를 나머지 구조체와 분리하는 공식 suffix가 없다.
      파트 태그나 별도 규칙 없이는 구조 질량과 payload 질량을 안전하게 분해할 수 없다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/part.html
  - field: exact_burn_time_as_core_sim_parameter
    reason: >-
      SHIP:STAGEDELTAV(num):DURATION은 문서화되어 있으나 stock DeltaV 문서가 자체적으로
      신뢰성 문제를 경고한다. 정밀 시뮬레이션 핵심값으로는 too risky다.
    source_doc: docs/domain_knowledge/KOS_DOC/structures/vessels/deltav.html
implementation_guidance:
  - 엔진 수집은 SHIP:PARTS + HASMODULE 추정보다 SHIP:ENGINES를 사용하고 Engine:STAGE로 stage를 나눌 것.
  - 탱크 수집은 ModuleFuelTanks 문자열 검사 대신 Part:RESOURCES를 순회할 것.
  - Resource 최대값은 CAPACITY를 사용할 것. MAX는 쓰지 말 것.
  - JSON에는 Atmosphere 객체 자체를 넣지 말고 primitive suffix만 body_info에 평탄화할 것.
  - 대기 세부값은 Body:ATM:EXISTS를 먼저 확인하고 없는 경우 null 또는 0/false 정책을 명시할 것.
  - stage_wet_mass 와 stage_dry_mass 는 Part:WETMASS 와 Part:DRYMASS 합산으로 계산할 것.
  - fuel_mass 와 oxidizer_mass 는 Resource:AMOUNT * Resource:DENSITY 로 계산할 것.
  - engine propellant 종류와 비율은 Engine:CONSUMEDRESOURCES 에서 NAME 과 RATIO를 읽을 것.
  - TWR가 필요하면 stage_max_thrust / (stage_wet_mass * local_g) 로 계산하되 local_g = body_mu / (body_radius + launch_altitude)^2 를 사용할 것.
  - exact length, diameter, reference_area, drag_coefficient, payload_mass 는 export schema에 넣지 말고, 필요하면 별도 규칙 또는 모드 의존성을 먼저 정의할 것.
