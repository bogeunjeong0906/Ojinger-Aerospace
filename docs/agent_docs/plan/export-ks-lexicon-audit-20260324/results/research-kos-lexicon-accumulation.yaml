task_id: research-kos-lexicon-accumulation
status: completed
summary: >-
  kOS 문서 기준으로 Lexicon:ADD는 unique key를 요구하며 기존 key에 다시 ADD하면 duplicate key error가 난다.
  반면 SET lex[key] TO value 는 key가 없으면 implicit add를 수행하고, key가 있으면 값을 in-place로 교체한다.
  export.ks 전체 audit 결과, resource 집계 구간은 HASKEY로 초기화 후 bracket assignment로 누적하는 안전한 패턴을 이미 사용하고 있으며,
  duplicate-key bug는 발견되지 않았다.
documented_rule:
  - Lexicon:ADD(key, value)는 unique key를 요구하며 기존 key에 다시 사용하면 duplicate key error가 발생한다.
  - 존재하지 않는 lexicon key를 GET 하면 KOSKeyNotFoundException error가 발생한다.
  - SET lex[key] TO value 는 key가 없으면 새 항목을 implicit add 하고, 있으면 기존 값을 교체한다.
  - 문자열 key는 기본적으로 case-insensitive 이므로 대소문자만 다른 key는 동일 key로 취급된다.
safe_patterns:
  - pattern: |
      IF NOT totals:HASKEY(name) {
          SET totals[name] TO 0.
      }
      SET totals[name] TO totals[name] + delta.
    why_safe: 최초 접근 시 missing-key GET error를 피하고, 반복 갱신 시 ADD duplicate-key error를 피한다.
  - pattern: |
      SET totals[name] TO initial_value.
      ...
      SET totals[name] TO totals[name] + delta.
    precondition: 모든 key가 첫 GET 전에 반드시 seed 되어 있어야 한다.
  - avoid:
      - 누적 루프에서 totals:ADD(name, value)를 반복 호출하는 방식
      - HASKEY 또는 사전 seed 없이 SET totals[name] TO totals[name] + delta 를 수행하는 방식
audited_occurrences:
  - location: src/Script/export.ks:142-152
    lexicons:
      - stage_resource_amounts
      - stage_resource_capacities
      - stage_resource_masses
      - stage_resource_capacity_masses
    assessment: 안전함. HASKEY guard 내부에서 누락 key를 bracket SET으로 0 초기화한 뒤, 같은 bracket GET과 SET으로 누적한다.
  - location: src/Script/export.ks:180-186
    lexicons:
      - eng:CONSUMEDRESOURCES
    assessment: 읽기 전용 접근이다. KEYS 순회와 index lookup만 사용하며 duplicate-style insertion risk는 없다.
  - location: src/Script/export.ks overall
    assessment: 추가적인 dynamic-key 누적 또는 duplicate-style insertion 패턴은 발견되지 않았다. 나머지 lexicon write는 literal key에 대한 단발성 bracket SET 또는 안전한 overwrite다.
implementation_guidance:
  - 현재 resource 집계 블록을 Lexicon:ADD 기반으로 바꾸지 말 것.
  - 반복 갱신이 필요한 resource-name key는 bracket assignment만 쓰고, 첫 read 이전에는 HASKEY 또는 사전 seed를 유지할 것.
  - 이번 audit 범위의 집계 lexicon은 숫자 primitive만 담으므로 직접적인 serialization 문제는 없다.
