task_id: implement-export-ks-lexicon-fix
status: completed
summary: >-
  src/Script/export.ks 전체를 duplicate-key LEXICON safety 관점에서 재감사한 결과,
  반복 누적이 발생하는 dynamic-key write는 stage_resource_* 집계 구간뿐이며 이 코드는
  HASKEY 확인 후 bracket assignment로 0 초기화하고 같은 bracket assignment로 누적한다.
  kOS 문서상 Lexicon:ADD는 기존 key에 대해 duplicate key error를 내지만,
  SET lex[key] TO value 는 key가 없으면 추가하고 있으면 교체하므로 현재 구현은 이미 안전하다.
  같은 이슈 클래스의 추가 수정 대상은 발견되지 않아 export.ks는 변경하지 않았다.
