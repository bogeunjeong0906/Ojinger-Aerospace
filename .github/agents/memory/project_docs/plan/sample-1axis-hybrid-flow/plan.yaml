  - id: T3
    title: Implement minimal fix
    description: |
      정의된 계약을 기준으로 최소 변경 구현을 수행하고 빠른 오류 검사를 진행한다.
    wave: 3
    agent: hybrid-implementer
    priority: high
    status: pending
    dependencies:
