patterns_found:
  - category: contracts
    pattern: contract-first backend boundary with golden fixtures
    description: tower-side Python modules와 tests가 단일 contract registry와 fixture set를 공유하여 schema drift를 억제한다.
    examples:
      - file: definitions.py
        location: system/control_tower/backend/contracts/definitions.py:238
        snippet: CONTRACTS registry + fixture_name + field specs + validators
      - file: test_contract_fixtures.py
        location: tests/test_contract_fixtures.py:24
        snippet: 모든 golden fixture를 로드하고 validate_contract_payload로 검증
    prevalence: dominant
  - category: runtime
    pattern: headless-first scaffold with optional dependency gates
    description: dearpygui와 krpc가 없어도 boot가 깨지지 않도록 mock telemetry와 degraded auto/ui 경로가 준비되어 있다.
    examples:
      - file: services.py
        location: system/control_tower/backend/services.py:71
        snippet: live 실패 시 mock telemetry fallback
      - file: application.py
        location: system/control_tower/manager/application.py:27
        snippet: auto mode에서 UI unavailable이면 degraded headless report 반환
    prevalence: dominant
  - category: optimization
    pattern: offline-solvable 1D ascent planning
    description: exporter payload를 request로 바꾸고 CasADi로 flight_plan을 생성하는 offline path가 구현되어 있다.
    examples:
      - file: optimizer.py
        location: system/control_tower/backend/optimizer.py:14
        snippet: parameter_export -> optimization_request adapter
      - file: optimizer.py
        location: system/control_tower/backend/optimizer.py:95
        snippet: feasibility + solve + diagnostics + checksum
    prevalence: dominant
  - category: integration
    pattern: exporter-complete but controller-missing asymmetry
    description: onboard side는 parameter export 생산자는 구현됐지만 flight_plan 소비자는 아직 비어 있어 tower-to-vessel loop가 닫히지 않았다.
    examples:
      - file: export_prams.ks
        location: system/vessle/export_prams.ks:68
        snippet: BUILD_PAYLOAD + WRITEJSON exporter 구현
      - file: controler_1axis.ks
        location: system/vessle/controler_1axis.ks:1
        snippet: empty file
    prevalence: dominant

related_architecture:
  components_relevant_to_domain:
    - component: contracts package
      responsibility: stable JSON boundary and golden fixture source
      location: system/control_tower/backend/contracts/
      relationship_to_domain: tower/onboard/shared schema baseline
    - component: runtime + service container
      responsibility: configuration load, dependency probing, telemetry/optimizer/supervisor assembly
      location: system/control_tower/backend/runtime.py and system/control_tower/backend/services.py
      relationship_to_domain: headless-safe bootstrap and dependency posture
    - component: manager application
      responsibility: headless/ui boot policy and operator-facing report
      location: system/control_tower/manager/application.py
      relationship_to_domain: current operator entry surface, but not full mission orchestration yet
    - component: optimizer
      responsibility: 1-axis request adaptation and plan solve
      location: system/control_tower/backend/optimizer.py
      relationship_to_domain: flight_plan producer
    - component: telemetry adapter
      responsibility: mock/live snapshot normalization
      location: system/control_tower/backend/telemetry.py
      relationship_to_domain: supervisory observation source
    - component: supervisor
      responsibility: lifecycle state machine and abort logic
      location: system/control_tower/backend/supervisor.py
      relationship_to_domain: safety monitoring core
    - component: export_prams.ks
      responsibility: parameter export
      location: system/vessle/export_prams.ks
      relationship_to_domain: optimizer input producer
    - component: controler_1axis.ks
      responsibility: planned flight plan consumer and actuator loop
      location: system/vessle/controler_1axis.ks
      relationship_to_domain: largest remaining onboard gap
  interfaces_used_by_domain:
    - contract_manifest() / load_golden_fixture() / validate_contract_payload()
    - RuntimeConfig.load() and ControlTowerApplication.boot()
    - build_optimization_request_from_parameter_export() -> Casadi1AxisOptimizer.solve()
    - TelemetrySnapshot.from_mapping() and MissionSupervisor.run_steps()
    - kOS WRITEJSON exporter contract handoff
  data_flow_involving_domain: export_prams.ks emits parameter_export JSON, tower normalizes it into optimization_request, CasADi generates flight_plan, telemetry/supervisor can monitor draft-to-abort/complete flows locally, but controler_1axis.ks does not yet consume the plan in runtime.
  key_relationships_to_domain:
    - from: system/vessle/export_prams.ks
      to: system/control_tower/backend/optimizer.py
      relationship: parameter export producer -> optimization request adapter input
    - from: system/control_tower/backend/contracts/
      to: tests/
      relationship: shared contract source -> regression guard
    - from: system/control_tower/backend/telemetry.py
      to: system/control_tower/backend/supervisor.py
      relationship: snapshot producer -> mission state machine consumer
    - from: system/control_tower/backend/optimizer.py
      to: system/vessle/controler_1axis.ks
      relationship: flight_plan producer -> pending onboard consumer

