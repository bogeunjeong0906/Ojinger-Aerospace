open_questions:
  - question: 실제 kOS 런타임에서 controller가 `READJSON`과 persistent polling/arming loop를 어떤 제약으로 수행하는가?
    context: T7 구현과 safety model에 직접 영향
  - question: host의 `flight_plan.json`을 kOS volume/files로 배포하는 표준 절차는 무엇인가?
    context: T8 orchestration이 dispatch까지 닫히려면 파일 handoff 정의가 필요
  - question: live kRPC 세션에서 altitude/speed/thrust field alias가 mock 가정과 완전히 일치하는가?
    context: supervisor abort/complete 판단 정확도에 영향

gaps:
  - area: onboard controller
    description: controler_1axis.ks가 비어 있어 flight_plan 소비, PID loop, safe idle/abort logic가 아직 없다
    impact: tower가 생성한 plan을 실제 비행 제어로 연결할 수 없다
  - area: mission orchestration
    description: manager는 boot/report까지 구현됐지만 export -> optimize -> dispatch -> monitor end-to-end flow는 없다
    impact: operator workflow와 integration test가 아직 성립하지 않는다
  - area: live runtime verification
    description: kRPC live connection, kOS volume exchange, 실제 KSP flight session이 로컬 workspace에서 검증되지 않았다
    impact: mock/offline assumptions가 실제 게임 런타임과 어긋날 수 있다
  - area: optional dependency enablement
    description: dearpygui와 krpc가 environment.yml에 고정되지 않아 live/UI setup은 수동 준비가 필요하다
    impact: future agents는 headless 기본값을 유지하고 설치/runbook 작업을 별도로 처리해야 한다
