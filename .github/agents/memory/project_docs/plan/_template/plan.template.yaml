plan_id: <string>
objective: <string>
created_at: <ISO-8601 timestamp>
created_by: hybrid-planner
status: pending_approval
research_confidence: medium

tldr: |
  - 요청 목표 요약
  - 주요 영향 범위
  - 핵심 리스크 또는 확인 포인트

open_questions:
  - <optional question>

pre_mortem:
  overall_risk_level: low
  critical_failure_modes:
    - scenario: <what can fail>
      likelihood: low
      impact: medium
      mitigation: <how to mitigate>
  assumptions:
    - <assumption>

implementation_specification:
  code_structure: <how code should be organized>
  affected_areas:
    - <path or module>
  component_details:
    - component: <name>
      responsibility: <responsibility>
      interfaces:
        - <public API or contract>
  dependencies:
    - component: <name>
      relationship: <depends on / provides to>
  integration_points:
    - <where it connects>

contracts:
  - from_task: <task id>
    to_task: <task id>
    interface: <what is exchanged>
    format: <schema or data shape>

tasks:
  - id: T1
    title: <task title>
    description: |
      <task detail>
    wave: 1
    agent: hybrid-researcher
    priority: high
    status: pending
    dependencies: []
    context_files:
      - <path>: <why relevant>
    estimated_effort: small
    estimated_files: 1
    estimated_lines: 100
    focus_area: <optional>
    verification:
      - <how to verify>
    acceptance_criteria:
      - <done condition>
    failure_modes:
      - scenario: <what can fail>
        likelihood: low
        impact: medium
        mitigation: <how to mitigate>
    tech_stack:
      - <optional>
    test_coverage: null
    requires_review: true
    review_depth: standard
    security_sensitive: false
    validation_matrix: []
    environment: null
    requires_approval: false
    task_type: update
    audience: developers
    coverage_matrix: []
